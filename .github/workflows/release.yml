name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Validate tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pako-core") | .version' | head -n1)"
          test "${GITHUB_REF_NAME#v}" = "$workspace_version"
      - name: Verify workspace
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Configure ARM linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - name: Build binaries
        run: cargo build --release --target "${{ matrix.target }}" -p pako-cli -p pako-build
      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          directory="pako-v${version}-${{ matrix.target }}"
          mkdir -p "$directory"
          cp "target/${{ matrix.target }}/release/pako" "$directory/"
          cp "target/${{ matrix.target }}/release/pako-build" "$directory/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$directory/"
          tar -czf "$directory.tar.gz" "$directory"
          sha256sum "$directory.tar.gz" > "$directory.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            pako-v*.tar.gz
            pako-v*.sha256

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Create checksums
        run: cat pako-v*.sha256 | sort > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=false
          case "$GITHUB_REF_NAME" in
            *alpha*|*beta*|*rc*) prerelease=true ;;
          esac
          gh release create "$GITHUB_REF_NAME" pako-v*.tar.gz SHA256SUMS \
            --verify-tag "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            $([ "$prerelease" = true ] && echo --prerelease)
